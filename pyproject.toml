[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Domain must not depend on API"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.api"]
